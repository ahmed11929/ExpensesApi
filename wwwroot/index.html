<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Expenses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2 class="mb-4">Expenses</h2>

    <div id="error" class="alert alert-danger d-none"></div>

    <!-- Budget alerts -->
    <div id="alerts"></div>

    <!-- Budgets -->
    <div class="card mb-4">
        <div class="card-header">Monthly budgets (this month)</div>
        <div class="card-body">
            <form id="budgetForm" class="row g-2 mb-3">
                <div class="col-md-4"><select id="budgetCategory" class="form-select"></select></div>
                <div class="col-md-4"><input id="budgetLimit" type="number" step="0.01" min="0.01" class="form-control" placeholder="Monthly limit" required></div>
                <div class="col-md-4"><button type="submit" class="btn btn-success w-100">Set budget</button></div>
            </form>
            <div id="budgetList"></div>
        </div>
    </div>

    <!-- Expense form -->
    <form id="expenseForm" class="row g-2 mb-4">
        <input type="hidden" id="id">
        <div class="col-md-2"><input id="value" type="number" step="0.01" class="form-control" placeholder="Value" required></div>
        <div class="col-md-2"><input id="date" type="date" class="form-control" required></div>
        <div class="col-md-3"><input id="description" class="form-control" placeholder="Description" required></div>
        <div class="col-md-3"><select id="category" class="form-select"></select></div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Save</button></div>
    </form>

    <div class="row g-2 mb-3">
        <div class="col-md-4"><select id="filterCategory" class="form-select"></select></div>
        <div class="col-md-2"><button id="filterBtn" type="button" class="btn btn-outline-secondary w-100">Filter</button></div>
        <div class="col-md-2"><button id="clearBtn" type="button" class="btn btn-outline-secondary w-100">Clear</button></div>
    </div>

    <table class="table table-striped">
        <thead>
            <tr><th>Value</th><th>Date</th><th>Description</th><th>Category</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const api = "/api/expenses";
        const budgetApi = "/api/budgets";
        // Edit this list to change the options
        const categories = ["Food", "Transport", "Shopping", "Bills", "Health", "Entertainment", "Other"];

        function today() { return new Date().toISOString().substring(0, 10); }
        function showError(msg) { $("#error").text(msg).removeClass("d-none"); }
        function clearError() { $("#error").addClass("d-none"); }

        function errorMessage(xhr) {
            let msg = "Error " + xhr.status;
            if (xhr.status === 400 && xhr.responseJSON && xhr.responseJSON.errors) {
                msg = Object.values(xhr.responseJSON.errors).flat().join(" ");
            }
            return msg;
        }

        function fillCategories() {
            ["#category", "#budgetCategory"].forEach(function (sel) {
                $(sel).empty();
                categories.forEach(function (c) { $(sel).append($("<option>").val(c).text(c)); });
            });
            $("#filterCategory").empty().append($("<option>").val("").text("All categories"));
            categories.forEach(function (c) {
                $("#filterCategory").append($("<option>").val(c).text(c));
            });
        }

        function resetForm() {
            $("#expenseForm")[0].reset();
            $("#id").val("");
            $("#date").val(today());
        }

        // ---------- Expenses ----------
        function load() {
            const category = $("#filterCategory").val();
            $.get(api, category ? { category: category } : {}, function (data) {
                $("#rows").empty();
                data.forEach(function (e) {
                    const tr = $("<tr>");
                    tr.append($("<td>").text(e.value));
                    tr.append($("<td>").text(e.date.substring(0, 10)));
                    tr.append($("<td>").text(e.description));
                    tr.append($("<td>").text(e.category || ""));

                    const actions = $("<td>");
                    actions.append($("<button>").addClass("btn btn-sm btn-warning edit me-1").attr("data-id", e.id).text("Edit"));
                    actions.append($("<button>").addClass("btn btn-sm btn-danger delete").attr("data-id", e.id).text("Delete"));
                    tr.append(actions);

                    $("#rows").append(tr);
                });
                loadBudgets();   // refresh alerts every time expenses change
            }).fail(function (xhr) {
                showError("Could not load expenses (" + errorMessage(xhr) + ").");
            });
        }

        $("#expenseForm").on("submit", function (ev) {
            ev.preventDefault();
            clearError();
            const id = $("#id").val();
            const expense = {
                id: id ? parseInt(id) : 0,
                value: parseFloat($("#value").val()),
                date: $("#date").val(),
                description: $("#description").val(),
                category: $("#category").val()
            };

            $.ajax({
                url: id ? api + "/" + id : api,
                type: id ? "PUT" : "POST",
                contentType: "application/json",
                data: JSON.stringify(expense),
                success: function () { resetForm(); load(); },
                error: function (xhr) { showError(errorMessage(xhr)); }
            });
        });

        $("#rows").on("click", ".edit", function () {
            clearError();
            $.get(api + "/" + $(this).data("id"), function (e) {
                $("#id").val(e.id);
                $("#value").val(e.value);
                $("#date").val(e.date.substring(0, 10));
                $("#description").val(e.description);

                const match = categories.find(c => c.toLowerCase() === (e.category || "").toLowerCase());
                if (match) {
                    $("#category").val(match);
                } else if (e.category) {
                    $("#category").append($("<option>").val(e.category).text(e.category));
                    $("#category").val(e.category);
                } else {
                    $("#category").val(categories[0]);
                }
            }).fail(function (xhr) {
                showError("Could not load the expense (" + errorMessage(xhr) + "). Refresh the page.");
            });
        });

        $("#rows").on("click", ".delete", function () {
            if (!confirm("Delete this expense?")) return;
            clearError();
            $.ajax({
                url: api + "/" + $(this).data("id"),
                type: "DELETE",
                success: load,
                error: function (xhr) { showError("Could not delete (" + errorMessage(xhr) + ")."); }
            });
        });

        // ---------- Budgets and alerts ----------
        function money(n) { return Number(n).toFixed(2); }

        function loadBudgets() {
            $.get(budgetApi + "/status", function (list) {
                $("#alerts").empty();
                $("#budgetList").empty();

                if (list.length === 0) {
                    $("#budgetList").append($("<p>").addClass("text-muted mb-0").text("No budgets yet. Set one above."));
                    return;
                }

                list.forEach(function (b) {
                    // alert banners
                    if (b.status === "over") {
                        $("#alerts").append($("<div>").addClass("alert alert-danger").text(
                            b.category + ": over budget by " + money(-b.remaining) +
                            " (spent " + money(b.spent) + " of " + money(b.limit) + ")."));
                    } else if (b.status === "warning") {
                        $("#alerts").append($("<div>").addClass("alert alert-warning").text(
                            b.category + ": " + b.percentUsed + "% of the budget used, " +
                            money(b.remaining) + " left."));
                    }

                    // progress bar row
                    const color = b.status === "over" ? "bg-danger" : b.status === "warning" ? "bg-warning" : "bg-success";
                    const row = $("<div>").addClass("mb-3");

                    const head = $("<div>").addClass("d-flex justify-content-between mb-1");
                    head.append($("<strong>").text(b.category));
                    head.append($("<span>").text(money(b.spent) + " / " + money(b.limit) + "  (" + b.percentUsed + "%)"));
                    row.append(head);

                    const bar = $("<div>").addClass("progress-bar " + color).css("width", Math.min(b.percentUsed, 100) + "%");
                    row.append($("<div>").addClass("progress").append(bar));

                    row.append($("<button>").addClass("btn btn-sm btn-outline-danger mt-1 delete-budget")
                        .attr("data-id", b.id).text("Remove budget"));

                    $("#budgetList").append(row);
                });
            }).fail(function (xhr) {
                showError("Could not load budgets (" + errorMessage(xhr) + ").");
            });
        }

        $("#budgetForm").on("submit", function (ev) {
            ev.preventDefault();
            clearError();
            $.ajax({
                url: budgetApi,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    category: $("#budgetCategory").val(),
                    monthlyLimit: parseFloat($("#budgetLimit").val())
                }),
                success: function () { $("#budgetLimit").val(""); loadBudgets(); },
                error: function (xhr) { showError(errorMessage(xhr)); }
            });
        });

        $("#budgetList").on("click", ".delete-budget", function () {
            if (!confirm("Remove this budget?")) return;
            clearError();
            $.ajax({
                url: budgetApi + "/" + $(this).data("id"),
                type: "DELETE",
                success: loadBudgets,
                error: function (xhr) { showError("Could not remove the budget (" + errorMessage(xhr) + ")."); }
            });
        });

        $("#filterBtn").on("click", load);
        $("#clearBtn").on("click", function () { $("#filterCategory").val(""); load(); });

        fillCategories();
        resetForm();
        load();
    </script>
</body>
</html>
